name: Sync

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'WSL Version (e.g. 1.0.0)'
        required: true

permissions:
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Download MSI
        uses: robinraju/release-downloader@v1
        with:
          repository: "microsoft/WSL"
          tag: ${{ github.event.inputs.version }}
          fileName: "*.msi"
          tarBall: false
          zipBall: false
          out-file-path: "out"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Output
        working-directory: out
        run: |
          du -sh wsl.${{ github.event.inputs.version }}.0.x64.msi
          du -sh wsl.${{ github.event.inputs.version }}.0.arm64.msi

      - name: Rename MSI Files
        run: |
          mv out/wsl.${{ github.event.inputs.version }}.0.x64.msi out/x64.msi
          mv out/wsl.${{ github.event.inputs.version }}.0.arm64.msi out/arm64.msi

      - name: Create latest.json
        run: |
          cat << EOF > latest.json
          {
            "version": "${{ github.event.inputs.version }}",
            "date": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "x64": {
              "url": "https://static.oomol.com/wsl-msi/${{ github.event.inputs.version }}/x64.msi",
              "sha256": "$(sha256sum out/x64.msi | cut -d ' ' -f 1)",
              "size": $(stat --printf="%s" out/x64.msi)
            },
            "arm64": {
              "url": "https://static.oomol.com/wsl-msi/${{ github.event.inputs.version }}/arm64.msi",
              "sha256": "$(sha256sum out/arm64.msi | cut -d ' ' -f 1)",
              "size": $(stat --printf="%s" out/arm64.msi)
            }
          }
          EOF
          cat latest.json | jq

      - name: Setup rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: |
            [oss]
            type = s3
            provider = Alibaba
            access_key_id = ${{ secrets.OSS_OOMOL_STATIC_S3_AK }}
            secret_access_key = ${{ secrets.OSS_OOMOL_STATIC_S3_SK }}
            endpoint = oss-ap-southeast-1.aliyuncs.com
            region = ap-southeast-1
          disable_base64: true

      - name: Upload MSI to OSS
        run: |
          rclone copy out/ oss:${{ secrets.OSS_OOMOL_STATIC_BUCKET }}/wsl-msi/${{ github.event.inputs.version }} --progress --transfers 10 --checkers 8 --s3-no-check-bucket --include "*.msi"

      - name: Upload latest.json
        run: |
          rclone copy latest.json oss:${{ secrets.OSS_OOMOL_STATIC_BUCKET }}/wsl-msi/latest.json --progress --transfers 10 --checkers 8 --s3-no-check-bucket
